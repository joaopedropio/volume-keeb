# Builds the firmware (.uf2) and the Windows app (.exe and its installer). Pushing a tag like
# v1.0.0 also publishes them, with the case's STLs, as a GitHub release, so
# people building a knob don't need QMK, a toolchain or Python. Run it by hand
# from the Actions tab to just get the files as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # The qmk_firmware tag the firmware is built and tested against.
  QMK_REF: "0.34.4"
  KB: handwired/onekey/waveshare_rp2040_zero_volume

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: ghcr.io/qmk/qmk_cli
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)" || { echo "tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"; exit 1; }
      - name: Get qmk_firmware
        run: git clone --depth 1 --branch "$QMK_REF" --recurse-submodules --shallow-submodules https://github.com/qmk/qmk_firmware.git /qmk_firmware
      - name: Build
        run: |
          ln -s "$GITHUB_WORKSPACE/qmk/waveshare_rp2040_zero_volume" "/qmk_firmware/keyboards/$KB"
          cd /qmk_firmware
          qmk compile -kb "$KB" -km volume
          cp handwired_onekey_waveshare_rp2040_zero_volume_volume.uf2 "$GITHUB_WORKSPACE/volume-keeb.uf2"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: volume-keeb.uf2

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: host
        run: powershell -ExecutionPolicy Bypass -File build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            host/dist/volume-keeb.exe
            host/dist/volume-keeb-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [firmware, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # SignPath Foundation's terms want the policy linked from the download page.
          body: |
            Windows: run `volume-keeb-setup.exe`. [Code signing policy](https://github.com/joaopedropio/volume-keeb#code-signing-policy-) · [Privacy](https://github.com/joaopedropio/volume-keeb#privacy)
          files: |
            dist/volume-keeb.uf2
            dist/volume-keeb.exe
            dist/volume-keeb-setup.exe
            case/volume_case-top.stl
            case/volume_case-base.stl
